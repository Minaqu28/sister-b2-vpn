# Konfigurasi ENDPOINT B (client) untuk lab network namespace.
# Jalankan dari root repositori:
# sudo ip netns exec vpn-b ./bin/vpn client -config configs/endpoint-b.conf

# Pre-shared key bersama; harus file yang sama dengan milik endpoint A.
key        = secret.key

# Alamat UDP endpoint ini. Berada di subnet underlay 10.10.2.0/24, yaitu subnet
# yang BERBEDA dari endpoint A (keduanya hanya terhubung lewat router).
listen     = 10.10.2.2:51820

# Alamat endpoint A yang dihubungi lebih dahulu.
peer       = 10.10.1.2:51820

# Interface TUN dan alamatnya di dalam tunnel.
tun        = vpn0
tun-addr   = 10.9.0.2/24

mtu        = 1400

# Subnet di belakang endpoint A, diarahkan masuk ke tunnel.
route      = 192.168.1.0/24

ip-forward = true
keepalive  = 15s
stats      = 10s
