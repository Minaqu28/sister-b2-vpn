# Konfigurasi ENDPOINT A (server) untuk lab network namespace.
# Jalankan dari root repositori:
# sudo ip netns exec vpn-a ./bin/vpn server -config configs/endpoint-a.conf

# Pre-shared key bersama. Dibuat dengan `make genkey`, tidak pernah di-commit.
key        = secret.key

# Alamat UDP tempat endpoint ini menunggu. Berada di subnet underlay 10.10.1.0/24.
listen     = 10.10.1.2:51820

# Interface TUN dan alamatnya di dalam tunnel.
tun        = vpn0
tun-addr   = 10.9.0.1/24

mtu        = 1400

# Subnet di belakang endpoint B, diarahkan masuk ke tunnel.
route      = 192.168.2.0/24

ip-forward = true
keepalive  = 15s
stats      = 10s
